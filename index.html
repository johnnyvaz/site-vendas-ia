<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Cabeçalho da rota: o scripts/prerender.mjs troca o bloco entre os
         marcadores em cada página pré-renderizada e no 404.html; no
         `npm run dev` fica este padrão e o useHead ajusta no navegador. -->
    <!--head:inicio-->
    <title>Vendas IA · Método comercial e inteligência artificial</title>
    <meta name="description" content="A Vendas IA estrutura o processo comercial da sua empresa em seis degraus e coloca a inteligência artificial para fazer o trabalho repetitivo, com pessoas no comando." />
    <!--head:fim-->

    <!-- Newsreader + Instrument Sans + JetBrains Mono: home (src/components/home);
         Plus Jakarta Sans: dobra do guia (src/components/dobra) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" />

    <!-- Additional Meta Tags -->
    <meta name="theme-color" content="#f5f2ec" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vendas IA" />
    <meta name="msapplication-TileColor" content="#0b0b0c" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Favicon and Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167x167.png" />

  </head>

  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
